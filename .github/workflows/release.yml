# Publishes to PyPI when you publish a GitHub Release (e.g. tag v0.2.0).
# Uses PyPI Trusted Publishing: no API tokens or passwords are stored anywhere.
name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Safety checks
        run: |
          if grep -rn "YOUR_USERNAME" README.md pyproject.toml; then
            echo "::error::Replace YOUR_USERNAME with your GitHub username before releasing."
            exit 1
          fi
          version=$(python -c "import devmedic; print(devmedic.__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match devmedic.__version__ ($version)."
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
