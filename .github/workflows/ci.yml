name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the installed command
        # Piped output exercises the non-interactive path (and, on Windows,
        # the legacy code page -> UTF-8 switch).
        run: |
          devmedic --version
          devmedic all
          devmedic system
          devmedic memory
          devmedic storage
          devmedic network
          devmedic tools
          devmedic projects
          devmedic cleanup
          devmedic notes
          devmedic ports -a
          devmedic procs -v
          devmedic caches
          devmedic junk .
          devmedic repos .
